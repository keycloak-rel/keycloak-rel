name: X Keycloak

on:
  workflow_call:
    inputs:
      gh-org:
        required: true
        type: string
      mvn-deploy-options:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
      MVN_USERNAME:
        required: true
      MVN_TOKEN:
        required: true
      GPG_PASSPHRASE:
        required: true
      GPG_PRIVATE_KEY:
        required: true

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          server-id: keycloak-publish
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Checkout Repository
        uses: actions/checkout@v3.0.0
        with:
          repository: '${{ inputs.gh-org }}/keycloak'
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ inputs.tag }}

      - name: Deploy to Maven
        env:
          MAVEN_ID: kc-rel-repository
          MAVEN_USERNAME: ${{ secrets.MVN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MVN_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          MVN_HTTP_CONFIG="-Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120"
          ./mvnw -nsu -B -Pgpg,jboss-release,distribution-downloads,all ${{ inputs.mvn-deploy-options }} -DskipTests -DskipTestsuite -DskipProjectTests $MVN_HTTP_CONFIG clean install

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd ./distribution/downloads/target
          for i in `gh release view ${{ inputs.tag }} --json assets --jq '.assets[].name'`; do 
            test -f $i || gh release delete-asset ${{ inputs.tag }} $i -y 
          done
          gh release upload ${{ inputs.tag }} ${{ inputs.version }}/*.tgz --clobber
          
          rm -rf mvn-orig/ 
          mkdir mvn-orig
          curl -L -s -o mvn-orig/keycloak-26.6.4.tar.gz https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.tar.gz
          curl -L -s -o mvn-orig/keycloak-26.6.4.tar.gz.asc https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.tar.gz.asc
          curl -L -s -o mvn-orig/keycloak-26.6.4.tar.gz.md5 https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.tar.gz.md5
          curl -L -s -o mvn-orig/keycloak-26.6.4.tar.gz.sha1 https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.tar.gz.sha1

          curl -L -s -o mvn-orig/keycloak-26.6.4.zip https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.zip
          curl -L -s -o mvn-orig/keycloak-26.6.4.zip.asc https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.zip.asc
          curl -L -s -o mvn-orig/keycloak-26.6.4.zip.md5 https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.zip.md5
          curl -L -s -o mvn-orig/keycloak-26.6.4.zip.sha1 https://repo1.maven.org/maven2/org/keycloak/keycloak-quarkus-dist/26.6.4/keycloak-quarkus-dist-26.6.4.zip.sha1

          curl -L -s -o mvn-orig/keycloak-api-docs-26.6.4.zip https://repo1.maven.org/maven2/org/keycloak/keycloak-api-docs-dist/26.6.4/keycloak-api-docs-dist-26.6.4.zip
          curl -L -s -o mvn-orig/keycloak-api-docs-26.6.4.zip.asc https://repo1.maven.org/maven2/org/keycloak/keycloak-api-docs-dist/26.6.4/keycloak-api-docs-dist-26.6.4.zip.asc
          curl -L -s -o mvn-orig/keycloak-api-docs-26.6.4.zip.md5 https://repo1.maven.org/maven2/org/keycloak/keycloak-api-docs-dist/26.6.4/keycloak-api-docs-dist-26.6.4.zip.md5
          curl -L -s -o mvn-orig/keycloak-api-docs-26.6.4.zip.sha1 https://repo1.maven.org/maven2/org/keycloak/keycloak-api-docs-dist/26.6.4/keycloak-api-docs-dist-26.6.4.zip.sha1

          curl -L -s -o mvn-orig/keycloak-documentation-26.6.4.zip https://repo1.maven.org/maven2/org/keycloak/documentation/keycloak-documentation/26.6.4/keycloak-documentation-26.6.4.zip
          curl -L -s -o mvn-orig/keycloak-documentation-26.6.4.zip.asc https://repo1.maven.org/maven2/org/keycloak/documentation/keycloak-documentation/26.6.4/keycloak-documentation-26.6.4.zip.asc
          curl -L -s -o mvn-orig/keycloak-documentation-26.6.4.zip.md5 https://repo1.maven.org/maven2/org/keycloak/documentation/keycloak-documentation/26.6.4/keycloak-documentation-26.6.4.zip.md5
          curl -L -s -o mvn-orig/keycloak-documentation-26.6.4.zip.sha1 https://repo1.maven.org/maven2/org/keycloak/documentation/keycloak-documentation/26.6.4/keycloak-documentation-26.6.4.zip.sha1

          gh release upload ${{ inputs.tag }} mvn-orig/keycloak-* --clobber

      - name: Show GitHub Release artifacts
        run: |
          ls ./distribution/downloads/target/${{ inputs.version }}/ | grep -v '.md5$' | grep -v '.sha1$' | sort | xargs -I {} echo "https://github.com/keycloak/keycloak/releases/download/${{ inputs.version }}/{}  " >> $GITHUB_STEP_SUMMARY
